<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self';script-src 'self';style-src 'self';img-src 'self' data: blob: airauto-media:;connect-src 'none'"><title>AirAuto 座舱</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="companion.css"></head>
<body class="companion dark">
<header class="companion-brand"><img src="airauto.png" alt=""><span>AirAuto</span><span class="chip"><span class="dot" id="dot"></span><span id="state">未连接</span></span></header>
<div class="companion-clock"><strong data-clock>--:--</strong><span id="date"></span></div>
<section class="companion-card">
  <h2>正在播放</h2>
  <div class="companion-media"><img id="art" alt="" hidden><div><strong id="track">暂无播放</strong><p id="artist"></p></div></div>
  <div class="companion-progress"><input id="seek" type="range" min="0" max="1" value="0" disabled><span id="time">00:00 / 00:00</span></div>
</section>
<section class="companion-card companion-metrics">
  <div><small>解码帧率</small><strong id="fps">—</strong></div>
  <div><small>画面尺寸</small><strong id="size">—</strong></div>
</section>
<footer class="companion-hint">投屏运行中 · Esc 最小化</footer>
<script src="companion.js"></script>
</body></html>
